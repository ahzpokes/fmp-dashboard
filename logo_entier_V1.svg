<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <title>Logo RADIS – DSNA</title>
  <desc>Logo RADIS avec animation radar et signature Réseau – Analyse – Données – Intelligence – Supervision.</desc>

  <style>
    .radar-static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .radar-live   { display: none; }
      .radar-static { display: block; }
      .signature-word { opacity: 1 !important; }
      .signature-dash { opacity: 1 !important; }
    }
  </style>

  <defs>
    <linearGradient id="leafOuterL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5C45"/>
      <stop offset="100%" stop-color="#3D8B6E"/>
    </linearGradient>
    <linearGradient id="leafInnerL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D8B6E"/>
      <stop offset="100%" stop-color="#6BBF9A"/>
    </linearGradient>
    <linearGradient id="leafOuterR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E5C45"/>
      <stop offset="100%" stop-color="#3D8B6E"/>
    </linearGradient>
    <linearGradient id="leafInnerR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3D8B6E"/>
      <stop offset="100%" stop-color="#6BBF9A"/>
    </linearGradient>
    <radialGradient id="radishBody" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF7B5A"/>
      <stop offset="50%" stop-color="#F04A2A"/>
      <stop offset="100%" stop-color="#D93A20"/>
    </radialGradient>
  </defs>

  <!-- ================= ONDES RADAR ================= -->
  <g class="radar-live" fill="none" stroke="#1B3A5C" stroke-linecap="round">

    <circle cx="400" cy="330" r="118" stroke="#3D8B6E" stroke-width="18" opacity="0.10">
      <animate attributeName="r" values="112;126;112" dur="5s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1"
               keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <animate attributeName="opacity" values="0.07;0.16;0.07" dur="5s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1"
               keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>

    <circle cx="400" cy="330" r="118" stroke-width="4" opacity="0">
      <animate attributeName="r" values="112;208;276" keyTimes="0;0.55;1"
               dur="4.2s" begin="-0.2s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
      <animate attributeName="opacity" values="0;0.40;0" keyTimes="0;0.18;1"
               dur="4.2s" begin="-0.2s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.3 0 0.4 1;0.35 0 0.6 1"/>
      <animate attributeName="stroke-width" values="4;2.2;1.1" keyTimes="0;0.55;1"
               dur="4.2s" begin="-0.2s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
    </circle>

    <circle cx="400" cy="330" r="118" stroke-width="3.2" opacity="0">
      <animate attributeName="r" values="112;216;292" keyTimes="0;0.55;1"
               dur="4.2s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
      <animate attributeName="opacity" values="0;0.28;0" keyTimes="0;0.18;1"
               dur="4.2s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.3 0 0.4 1;0.35 0 0.6 1"/>
      <animate attributeName="stroke-width" values="3.2;1.8;0.9" keyTimes="0;0.55;1"
               dur="4.2s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
    </circle>

    <circle cx="400" cy="330" r="118" stroke-width="2.6" opacity="0">
      <animate attributeName="r" values="112;224;308" keyTimes="0;0.55;1"
               dur="4.2s" begin="-3s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
      <animate attributeName="opacity" values="0;0.18;0" keyTimes="0;0.18;1"
               dur="4.2s" begin="-3s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.3 0 0.4 1;0.35 0 0.6 1"/>
      <animate attributeName="stroke-width" values="2.6;1.4;0.75" keyTimes="0;0.55;1"
               dur="4.2s" begin="-3s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.16 0.66 0.3 1;0.32 0 0.55 1"/>
    </circle>
  </g>

  <g class="radar-static" fill="none" stroke="#1B3A5C" stroke-linecap="round">
    <circle cx="400" cy="330" r="190" stroke-width="2"   opacity="0.18"/>
    <circle cx="400" cy="330" r="252" stroke-width="1.5" opacity="0.10"/>
  </g>

  <!-- ================= FEUILLES ================= -->
  <g>
    <path d="M390,350 C300,290 230,180 250,120 C300,160 360,250 395,345 Z" fill="url(#leafOuterL)"/>
    <path d="M395,348 C340,300 280,210 290,150 C330,190 370,260 398,345 Z" fill="url(#leafInnerL)"/>
    <path d="M410,350 C500,290 570,180 550,120 C500,160 440,250 405,345 Z" fill="url(#leafOuterR)"/>
    <path d="M405,348 C460,300 520,210 510,150 C470,190 430,260 402,345 Z" fill="url(#leafInnerR)"/>
  </g>

  <!-- ================= CORPS DU RADIS ================= -->
  <path d="M295,350 A105,105 0 0,1 505,350 C505,420 455,480 400,520 C345,480 295,420 295,350 Z"
        fill="url(#radishBody)"/>

  <!-- ================= VISAGE ================= -->
  <path d="M352,340 Q366,326 380,340" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
  <path d="M420,340 Q434,326 448,340" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="338" cy="365" rx="14" ry="9" fill="#FF9999" opacity="0.75"/>
  <ellipse cx="462" cy="365" rx="14" ry="9" fill="#FF9999" opacity="0.75"/>
  <path d="M387,380 Q400,393 413,380" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>

  <!-- ================= TEXTE RADIS ================= -->
  <text x="400" y="700" text-anchor="middle"
        font-family="Arial Black, Helvetica, sans-serif"
        font-size="150" font-weight="900" fill="#1B3A5C"
        textLength="600" lengthAdjust="spacingAndGlyphs">RADIS</text>

  <!-- ================= SIGNATURE ANIMÉE ================= -->
  <!--
    Chaque mot et chaque tiret est un élément séparé.
    Les tirets sont des <line> pour être sûrs qu'ils
    soient parfaitement alignés au milieu de la ligne de base.
  -->
  <g font-family="Helvetica, Arial, sans-serif"
     font-size="22" font-weight="500" fill="#1B3A5C"
     letter-spacing="1">

    <!-- Réseau -->
    <text class="signature-word" x="115" y="770" text-anchor="start" opacity="0">
      Réseau
      <animate attributeName="opacity" from="0" to="1"
               begin="0.4s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Tiret 1 -->
    <line class="signature-dash" x1="200" y1="763" x2="218" y2="763"
          stroke="#1B3A5C" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1"
               begin="0.8s" dur="0.3s" fill="freeze"/>
    </line>

    <!-- Analyse -->
    <text class="signature-word" x="232" y="770" text-anchor="start" opacity="0">
      Analyse
      <animate attributeName="opacity" from="0" to="1"
               begin="1.0s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Tiret 2 -->
    <line class="signature-dash" x1="328" y1="763" x2="346" y2="763"
          stroke="#1B3A5C" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1"
               begin="1.4s" dur="0.3s" fill="freeze"/>
    </line>

    <!-- Données -->
    <text class="signature-word" x="360" y="770" text-anchor="start" opacity="0">
      Données
      <animate attributeName="opacity" from="0" to="1"
               begin="1.6s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Tiret 3 -->
    <line class="signature-dash" x1="460" y1="763" x2="478" y2="763"
          stroke="#1B3A5C" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1"
               begin="2.0s" dur="0.3s" fill="freeze"/>
    </line>

    <!-- Intelligence -->
    <text class="signature-word" x="492" y="770" text-anchor="start" opacity="0">
      Intelligence
      <animate attributeName="opacity" from="0" to="1"
               begin="2.2s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Tiret 4 -->
    <line class="signature-dash" x1="622" y1="763" x2="640" y2="763"
          stroke="#1B3A5C" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1"
               begin="2.6s" dur="0.3s" fill="freeze"/>
    </line>

    <!-- Supervision -->
    <text class="signature-word" x="654" y="770" text-anchor="start" opacity="0">
      Supervision
      <animate attributeName="opacity" from="0" to="1"
               begin="2.8s" dur="0.5s" fill="freeze"/>
    </text>
  </g>
</svg>