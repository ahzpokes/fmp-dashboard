name: Update Data (BDD)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch Eurocontrol data and upsert to Nhost
        env:
          NHOST_DB_URL: ${{ secrets.NHOST_DB_URL }}
        run: python scripts/fetch_data_bdd.py