name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
      timezone: 'Europe/Paris'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch Eurocontrol data
        run: python scripts/fetch_data.py

      - name: Push to data branch
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data || true
          git worktree add /tmp/data-branch data 2>/dev/null || git worktree add -b data /tmp/data-branch
          mkdir -p /tmp/data-branch/data
          cp src/data/traffic_data.json /tmp/data-branch/data/traffic_data.json
          cd /tmp/data-branch
          git add data/traffic_data.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin data
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No change in data"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Purge jsDelivr cache
        if: steps.push.outputs.pushed == 'true'
        run: |
          echo "🔄 Purge du cache jsDelivr..."
          curl -s "https://purge.jsdelivr.net/gh/ahzpokes/fmp-dashboard@data/data/traffic_data.json" | head -20
          echo "✅ Cache purgé"