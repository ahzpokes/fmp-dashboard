<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Ajout de ?v=2 pour forcer le navigateur à recharger les nouvelles icônes -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg?v=2" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg?v=2" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1329" />
    <meta
      name="description"
      content="Tableau de bord opérationnel DSNA pour le suivi des performances de trafic et des délais ATFM des centres de contrôle en-route."
    />

    <!--
      Manifest PWA dynamique :
      - L'id "pwa-manifest" permet au hook useDynamicManifest de cibler cette balise
        et de modifier son href en JS selon le pathname (/brest, /reims, etc.).
      - La valeur par défaut pointe vers Reims (ACC de repli).
    -->
    <link id="pwa-manifest" rel="manifest" href="/manifest-reims.json" />

    <!--
      Balises iOS spécifiques au mode standalone (Add to Home Screen sur Safari) :
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      id="apple-mobile-title"
      name="apple-mobile-web-app-title"
      content="Reims"
    />

    <title>RADIS</title>
  </head>
  <body>
    <!--
      ⚠️ Aucune classe Tailwind ici !
      Les couleurs sont gérées par les variables CSS de src/index.css
      pour permettre le toggle Dark/Light sans conflit.
    -->
    <div id="loading-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    ">
      <!-- 
        Utilisation de votre fichier externe. 
        L'attribut ?v=2 force le rechargement du cache.
        Les animations SVG à l'intérieur du fichier fonctionneront normalement.
      -->
      <img 
        src="/logo_chargement.svg?v=2" 
        alt="Chargement de RADIS" 
        style="max-width: 400px; max-height: 80vh; width: 100%; height: auto;" 
      />
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Masquer l'écran de chargement après l'animation complète (4 secondes)
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
              document.body.style.overflow = '';
            }, 500);
          }, 4000);
        }
      });

      // Empêcher le scroll pendant le chargement
      document.body.style.overflow = 'hidden';
    </script>
  </body>
</html>
